name: Generate Contribution Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - .github/workflows/snake.yml

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 10

    steps:
      - name: Generate Catppuccin contribution snake SVG
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake-catppuccin.svg?color_snake=#cba6f7&color_dots=#181825,#313244,#74c7ec,#89b4fa,#a6e3a1
            dist/github-snake-latte.svg?color_snake=#8839ef&color_dots=#eff1f5,#ccd0da,#7287fd,#1e66f5,#40a02b

      - name: Push snake SVG to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
