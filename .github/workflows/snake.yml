name: Generate Neon Contribution Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - .github/workflows/snake.yml

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 10

    steps:
      - name: Generate neon contribution snake SVG
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake-neon.svg?color_snake=#FF2A85&color_dots=#161b22,#083344,#0e7490,#06b6d4,#00f5d4
            dist/github-snake-light.svg?color_snake=#FF2A85&color_dots=#ebedf0,#a5f3fc,#22d3ee,#0891b2,#0e7490

      - name: Push snake SVG to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
