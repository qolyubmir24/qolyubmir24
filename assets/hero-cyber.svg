<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" width="900" height="260" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="900" y2="260" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#050814"/>
      <stop offset="55%" stop-color="#0B1124"/>
      <stop offset="100%" stop-color="#130926"/>
    </linearGradient>
    <linearGradient id="neonLine" x1="0" y1="0" x2="900" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00F5D4"/>
      <stop offset="50%" stop-color="#9D4EDD"/>
      <stop offset="100%" stop-color="#FF2A85"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="40" y1="70" x2="540" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="55%" stop-color="#00F5D4"/>
      <stop offset="100%" stop-color="#FF2A85"/>
    </linearGradient>
    <radialGradient id="glowCyan" cx="78%" cy="48%" r="36%">
      <stop offset="0%" stop-color="#00F5D4" stop-opacity="0.22"/>
      <stop offset="60%" stop-color="#9D4EDD" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#050814" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowPink" cx="18%" cy="85%" r="35%">
      <stop offset="0%" stop-color="#FF2A85" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#050814" stop-opacity="0"/>
    </radialGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="cardClip">
      <polygon points="22,6 894,6 894,234 878,254 6,254 6,26"/>
    </clipPath>
    <style>
      .mono { font-family: 'JetBrains Mono', 'Fira Code', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .sans { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
      .pulse { animation: pulseAnim 2.2s ease-in-out infinite; }
      .flow { stroke-dasharray: 6 6; animation: flowAnim 2.4s linear infinite; }
      .flowSlow { stroke-dasharray: 4 8; animation: flowAnim 4s linear infinite reverse; }
      .orbit { transform-origin: 730px 130px; animation: spinAnim 18s linear infinite; }
      .scan { animation: scanAnim 5s ease-in-out infinite; }
      @keyframes pulseAnim { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
      @keyframes flowAnim { to { stroke-dashoffset: -24; } }
      @keyframes spinAnim { to { transform: rotate(360deg); } }
      @keyframes scanAnim { 0%, 100% { transform: translateY(0px); opacity: 0.14; } 50% { transform: translateY(230px); opacity: 0.35; } }
    </style>
  </defs>

  <g clip-path="url(#cardClip)">
    <rect width="900" height="260" fill="url(#bgGrad)"/>
    <rect width="900" height="260" fill="url(#glowCyan)"/>
    <rect width="900" height="260" fill="url(#glowPink)"/>

    <!-- Subtle Cyber Grid -->
    <g stroke="#00F5D4" stroke-opacity="0.07" stroke-width="1">
      <line x1="0" y1="52" x2="900" y2="52"/>
      <line x1="0" y1="104" x2="900" y2="104"/>
      <line x1="0" y1="156" x2="900" y2="156"/>
      <line x1="0" y1="208" x2="900" y2="208"/>
      <line x1="150" y1="0" x2="150" y2="260"/>
      <line x1="300" y1="0" x2="300" y2="260"/>
      <line x1="450" y1="0" x2="450" y2="260"/>
      <line x1="600" y1="0" x2="600" y2="260"/>
      <line x1="750" y1="0" x2="750" y2="260"/>
    </g>

    <!-- Animated Scanline -->
    <rect class="scan" x="0" y="10" width="900" height="2" fill="url(#neonLine)"/>
  </g>

  <!-- Chamfered Neon Frame -->
  <polygon points="22,6 894,6 894,234 878,254 6,254 6,26" stroke="url(#neonLine)" stroke-width="2" fill="none" filter="url(#neonGlow)"/>
  <polyline points="20,16 14,16 14,22" stroke="#00F5D4" stroke-width="2"/>
  <polyline points="886,238 886,246 878,246" stroke="#FF2A85" stroke-width="2"/>

  <!-- Status Pill -->
  <rect x="44" y="34" width="248" height="26" rx="13" fill="#0F172A" stroke="#00F5D4" stroke-opacity="0.55" stroke-width="1"/>
  <circle class="pulse" cx="62" cy="47" r="4.5" fill="#00F5D4" filter="url(#neonGlow)"/>
  <text x="75" y="51" class="mono" font-size="11.5" fill="#00F5D4" letter-spacing="1.2">SYS.ONLINE // ML &amp; DATA</text>

  <!-- Main Name & Role -->
  <text x="44" y="106" class="sans" font-size="44" font-weight="800" fill="url(#titleGrad)" letter-spacing="1.5" filter="url(#neonGlow)">MIRWAN QOLYUBI</text>
  <text x="46" y="138" class="mono" font-size="16" fill="#E2E8F0">
    <tspan fill="#FF2A85">&gt;_</tspan> Machine Learning &amp; Data Science <tspan fill="#00F5D4">[Python]</tspan>
  </text>
  <text x="46" y="165" class="mono" font-size="13" fill="#94A3B8">UPN "Veteran" Yogyakarta  |  Informatics Engineering</text>

  <!-- Neon Skill Chips -->
  <g transform="translate(44, 190)">
    <rect x="0" y="0" width="66" height="26" rx="5" fill="#0F172A" stroke="#00F5D4" stroke-opacity="0.7"/>
    <text x="33" y="17" text-anchor="middle" class="mono" font-size="11.5" fill="#00F5D4">PYTHON</text>

    <rect x="76" y="0" width="110" height="26" rx="5" fill="#0F172A" stroke="#9D4EDD" stroke-opacity="0.8"/>
    <text x="131" y="17" text-anchor="middle" class="mono" font-size="11.5" fill="#D8B4FE">SCIKIT-LEARN</text>

    <rect x="196" y="0" width="76" height="26" rx="5" fill="#0F172A" stroke="#FF2A85" stroke-opacity="0.75"/>
    <text x="234" y="17" text-anchor="middle" class="mono" font-size="11.5" fill="#FF85B3">PANDAS</text>

    <rect x="282" y="0" width="96" height="26" rx="5" fill="#0F172A" stroke="#38BDF8" stroke-opacity="0.75"/>
    <text x="330" y="17" text-anchor="middle" class="mono" font-size="11.5" fill="#7DD3FC">STREAMLIT</text>
  </g>

  <!-- Right Side: Cyber Neural Network Graphic -->
  <g>
    <circle class="orbit" cx="730" cy="130" r="84" stroke="#00F5D4" stroke-opacity="0.22" stroke-width="1.2" stroke-dasharray="10 8 3 8"/>
    <circle cx="730" cy="130" r="62" stroke="#FF2A85" stroke-opacity="0.22" stroke-width="1"/>

    <!-- Neural Edges -->
    <g stroke-width="1.4">
      <line class="flow" x1="650" y1="80" x2="730" y2="68" stroke="#00F5D4" stroke-opacity="0.65"/>
      <line class="flowSlow" x1="650" y1="80" x2="730" y2="130" stroke="#9D4EDD" stroke-opacity="0.65"/>
      <line class="flow" x1="650" y1="130" x2="730" y2="68" stroke="#9D4EDD" stroke-opacity="0.55"/>
      <line class="flow" x1="650" y1="130" x2="730" y2="130" stroke="#00F5D4" stroke-opacity="0.8"/>
      <line class="flowSlow" x1="650" y1="130" x2="730" y2="192" stroke="#FF2A85" stroke-opacity="0.6"/>
      <line class="flow" x1="650" y1="180" x2="730" y2="130" stroke="#9D4EDD" stroke-opacity="0.6"/>
      <line class="flow" x1="650" y1="180" x2="730" y2="192" stroke="#00F5D4" stroke-opacity="0.65"/>

      <line class="flow" x1="730" y1="68" x2="812" y2="100" stroke="#FF2A85" stroke-opacity="0.7"/>
      <line class="flowSlow" x1="730" y1="130" x2="812" y2="100" stroke="#00F5D4" stroke-opacity="0.75"/>
      <line class="flow" x1="730" y1="130" x2="812" y2="160" stroke="#FF2A85" stroke-opacity="0.75"/>
      <line class="flowSlow" x1="730" y1="192" x2="812" y2="160" stroke="#9D4EDD" stroke-opacity="0.7"/>
    </g>

    <!-- Neural Nodes -->
    <g filter="url(#neonGlow)">
      <circle cx="650" cy="80" r="6" fill="#0B1124" stroke="#00F5D4" stroke-width="2"/>
      <circle cx="650" cy="130" r="6" fill="#0B1124" stroke="#00F5D4" stroke-width="2"/>
      <circle cx="650" cy="180" r="6" fill="#0B1124" stroke="#00F5D4" stroke-width="2"/>

      <circle cx="730" cy="68" r="7" fill="#0B1124" stroke="#9D4EDD" stroke-width="2.2"/>
      <circle class="pulse" cx="730" cy="130" r="9" fill="#00F5D4" stroke="#F8FAFC" stroke-width="2"/>
      <circle cx="730" cy="192" r="7" fill="#0B1124" stroke="#9D4EDD" stroke-width="2.2"/>

      <circle cx="812" cy="100" r="7" fill="#0B1124" stroke="#FF2A85" stroke-width="2.2"/>
      <circle cx="812" cy="160" r="7" fill="#0B1124" stroke="#FF2A85" stroke-width="2.2"/>
    </g>

    <text x="730" y="236" text-anchor="middle" class="mono" font-size="10.5" fill="#64748B" letter-spacing="1.5">MODEL // INFERENCE // INSIGHT</text>
  </g>
</svg>
